name: CI

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Unit and regression tests (no API credentials)
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify package data and exclusion of private files
        env:
          LATEXTRANS_DIST_DIR: dist
        run: python -m pytest tests/test_packaging.py -q
      - name: Install wheel and run CLI outside checkout
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import venv

          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          with tempfile.TemporaryDirectory() as folder:
              root = pathlib.Path(folder)
              environment = root / "venv"
              venv.create(environment, with_pip=True)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-m", "pip", "install", str(wheel)], check=True)
              outside = root / "outside"
              outside.mkdir()
              code = "\n".join([
                  "import importlib.resources as resources, pathlib, sys",
                  "from importlib.metadata import version",
                  "import main, src, config, terms",
                  "from src.runtime import load_layered_config, local_config_path, resolve_path",
                  "prefix = pathlib.Path(sys.prefix).resolve()",
                  "assert all(pathlib.Path(module.__file__).resolve().is_relative_to(prefix) for module in (main, src, config, terms))",
                  "assert src.__version__ == version('LaTeXTrans')",
                  "assert resources.files('terms').joinpath('default.csv').is_file()",
                  "assert load_layered_config(env={})['llm_config']['api_key'] == ''",
                  "assert resolve_path('outputs').resolve() == (pathlib.Path.cwd() / 'outputs').resolve()",
                  "assert local_config_path().resolve() == (pathlib.Path.cwd() / 'config' / 'local.toml').resolve()",
                  "local_config_path().parent.mkdir(parents=True, exist_ok=True)",
                  "local_config_path().write_text('[llm_config]\\nmodel = \\\"wheel-smoke-model\\\"\\n', encoding='utf-8')",
                  "assert load_layered_config(env={})['llm_config']['model'] == 'wheel-smoke-model'",
              ])
              subprocess.run([str(python), "-I", "-c", code], cwd=outside, check=True)
              cli = environment / ("Scripts/latextrans.exe" if os.name == "nt" else "bin/latextrans")
              subprocess.run([str(cli), "--help"], cwd=outside, check=True)
          PY

  tex-integration:
    name: XeLaTeX compilation and repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-xetex texlive-latex-extra texlive-lang-chinese fonts-noto-cjk
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Real compilation and repair tests with mocked model responses
        run: python -m pytest tests/test_compile_repair.py tests/test_cli_and_xelatex_regressions.py -q
