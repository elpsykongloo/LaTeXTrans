[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LaTeXTrans"
version = "0.2.0"
description = "Maintained fork of NiuTrans LaTeXTrans with resumable translation and bilingual PDF output"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "NiuTrans Open Source and LaTeXTrans contributors"}]
maintainers = [{name = "elpsykongloo"}]
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/elpsykongloo/LaTeXTrans"
Issues = "https://github.com/elpsykongloo/LaTeXTrans/issues"
Upstream = "https://github.com/NiuTrans/LaTeXTrans"
Changelog = "https://github.com/elpsykongloo/LaTeXTrans/blob/main/CHANGELOG.md"

[project.scripts]
latextrans = "main:main"
latextrans-gui = "src.gui.launcher:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-subtests>=0.14,<1", "build>=1.2,<2"]

[tool.setuptools]
py-modules = ["main"]
include-package-data = false

[tool.setuptools.packages.find]
include = ["src", "src.*", "terms", "config"]

[tool.setuptools.package-data]
terms = ["*.csv"]
config = ["default.toml"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
